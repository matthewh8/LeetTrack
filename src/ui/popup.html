<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LeetTrack</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <header class="p-head">
    <div class="p-streak">
      <span class="p-figure tabular" id="p-streak">—</span>
      <span class="p-unit">day streak</span>
    </div>
    <button class="btn btn-sm" id="p-open">Dashboard</button>
  </header>
  <p class="p-sub" id="p-sub"></p>
  <section class="p-queue" id="p-queue"></section>
</body>
<script type="module" src="popup.js"></script>
</html>
