<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeetTrack</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <div class="brand">
        <img src="../../icons/icon-32.png" alt="" width="22" height="22">
        <div>
          <h1>LeetTrack</h1>
          <p id="sync-note">Loading…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-sm" id="btn-sync">Sync now</button>
        <button class="btn btn-sm" id="btn-theme" aria-label="Toggle theme">Theme</button>
        <button class="btn btn-sm" id="btn-settings" aria-expanded="false">Settings</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <!-- Reviews first and full width: it is the only part of this page you act
         on. Everything below it is a read-out. -->
    <section class="card block rev-card" aria-labelledby="rev-h">
      <div class="card-head">
        <h2 id="rev-h">Reviews</h2>
        <div class="rev-head-end">
          <span class="note" id="rev-note"></span>
          <div class="filters">
            <label class="visually-hidden" for="f-group">Filter reviews by group</label>
            <select id="f-group" class="mini"></select>
            <label class="visually-hidden" for="f-diff">Filter reviews by difficulty</label>
            <select id="f-diff" class="mini"></select>
            <button class="btn btn-sm" id="btn-filter-clear" hidden>Clear</button>
          </div>
        </div>
      </div>
      <div class="rev-split">
        <div class="rev-cal">
          <div id="calendar" class="cal"></div>
        </div>
        <div class="rev-side">
          <div class="rev-summary">
            <p class="figure tabular" id="due-n">—</p>
            <div class="rev-summary-txt">
              <p class="figure-unit">due today</p>
              <p class="stat-sub" id="due-sub"></p>
            </div>
          </div>
          <div id="queue" class="queue"></div>
          <div id="retired"></div>
        </div>
      </div>
    </section>

    <section class="hero" aria-label="Summary">
      <div class="card stat">
        <div class="card-head"><h2>Current streak</h2></div>
        <div class="stat-body">
          <p class="figure tabular" id="streak-n">—</p>
          <p class="figure-unit" id="streak-unit">days</p>
        </div>
        <p class="stat-sub" id="streak-sub"></p>
        <dl class="stat-meta">
          <div><dt>Longest</dt><dd class="tabular" id="streak-longest">—</dd></div>
          <div><dt>Active days</dt><dd class="tabular" id="streak-active">—</dd></div>
        </dl>
      </div>

      <div class="card stat">
        <div class="card-head"><h2>Problems solved</h2></div>
        <div class="stat-body">
          <p class="figure tabular" id="solved-n">—</p>
          <p class="figure-unit">unique</p>
        </div>
        <div class="diffbar" id="diffbar" role="img" aria-label="Solved by difficulty"></div>
        <ul class="difflegend" id="difflegend"></ul>
      </div>
    </section>

    <section class="card block" aria-labelledby="hm-h">
      <div class="card-head">
        <h2 id="hm-h">Activity</h2>
        <span class="note" id="hm-note"></span>
      </div>
      <div class="heatmap-scroll"><div id="heatmap"></div></div>
    </section>

    <div class="two-col">
      <section class="card block" aria-labelledby="pat-h">
        <div class="card-head">
          <h2 id="pat-h">Patterns</h2>
          <span class="note" id="pat-note"></span>
        </div>
        <div id="patterns" class="patterns"></div>
      </section>

      <section class="card block" aria-labelledby="rs-h">
        <div class="card-head"><h2 id="rs-h">Recent solves</h2></div>
        <div id="recent" class="recent"></div>
      </section>
    </div>

    <!-- The index: every tracked problem, searchable, and narrowed by the same
         group and difficulty filter the Reviews card is set to. -->
    <section class="card block" aria-labelledby="db-h">
      <div class="card-head">
        <h2 id="db-h">All problems</h2>
        <span class="note" id="db-note"></span>
      </div>
      <div class="db-controls">
        <label class="visually-hidden" for="db-q">Search problems</label>
        <input type="search" id="db-q" class="db-search" autocomplete="off" spellcheck="false"
          placeholder="Search by number, title, or tag…">
        <label class="visually-hidden" for="db-group">Filter by group</label>
        <select id="db-group" class="mini"></select>
        <label class="visually-hidden" for="db-diff">Filter by difficulty</label>
        <select id="db-diff" class="mini"></select>
        <label class="visually-hidden" for="db-status">Filter by review status</label>
        <select id="db-status" class="mini"></select>
        <label class="visually-hidden" for="db-sort">Sort by</label>
        <select id="db-sort" class="mini"></select>
      </div>
      <div id="problems" class="db"></div>
    </section>

    <p class="footnote">
      Everything stays in this browser. Nothing is uploaded.
      <button class="linkish" id="btn-export">Export JSON</button> ·
      <button class="linkish" id="btn-import">Import JSON</button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </p>
  </main>

  <dialog id="settings" class="sheet">
    <form method="dialog" class="sheet-in" id="settings-form">
      <h2>Settings</h2>

      <label class="field">
        <span>Timezone</span>
        <input name="timezone" id="f-tz" list="tz-list" autocomplete="off">
        <datalist id="tz-list"></datalist>
        <small>Day boundaries for streaks and reviews.</small>
      </label>

      <label class="field">
        <span>Review intervals (days)</span>
        <input name="intervals" id="f-intervals" inputmode="numeric" autocomplete="off">
        <small>Comma separated. Each “Done” moves a problem one rung up;
          “Nailed it” moves it two. The last rung repeats forever, so a mature
          problem keeps coming back at that cadence instead of vanishing.</small>
      </label>

      <label class="field">
        <span>Track from</span>
        <input type="date" name="trackFrom" id="f-track-from" autocomplete="off">
        <small>Solves before this date are ignored, and saving a later date
          deletes the history before it. Leave empty to track everything.</small>
      </label>

      <label class="field">
        <span>A new day starts at</span>
        <select name="dayStartHour" id="f-day-start"></select>
        <small>Late-night solves count towards the day you started, not the one
          the clock just rolled into. Changing this re-files your existing
          history against the new boundary.</small>
      </label>

      <label class="field row">
        <input type="checkbox" name="dailyReminder" id="f-remind">
        <span>Daily reminder</span>
      </label>

      <label class="field" id="f-hour-wrap">
        <span>Remind me at</span>
        <select name="reminderHour" id="f-hour"></select>
      </label>

      <label class="field">
        <span>Theme</span>
        <select name="theme" id="f-theme">
          <option value="system">Match system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>

      <label class="field">
        <span>Open problem links on</span>
        <select name="linkSite" id="f-link-site">
          <option value="leetcode">LeetCode</option>
          <option value="neetcode">NeetCode</option>
        </select>
        <small>Where the problem title in the queue, recent solves, and
          problem list points. NeetCode uses the same slug as LeetCode for the
          problems it hosts.</small>
      </label>

      <p class="sheet-msg" id="settings-msg" role="status"></p>

      <div class="sheet-actions">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn btn-primary" id="btn-save" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
